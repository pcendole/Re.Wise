<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F4" id="theme-color-meta" />
    <meta name="description" content="Re.Wise — Adaptive AI Spaced Repetition" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Re.Wise — Adaptive AI Spaced Repetition</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('rewise_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            const meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#000000');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-theme-primary antialiased min-h-screen selection:bg-[#2D5340]/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
